---
- name: Verify Healthchecks
  hosts: all
  become: true
  gather_facts: false

  vars:
    healthchecks_verify_base_url: "http://localhost:{{ healthchecks_container_http_host_bind_port }}"

    healthchecks_verify_superuser_email: molecule@example.com
    healthchecks_verify_superuser_password: molecule-superuser-password
    healthchecks_verify_check_name: molecule-probe

    # Django's own name for the backend behind each `healthchecks_database_type`
    # value. The running application reports it from the connection it opened,
    # which is what makes it a statement about this scenario's wiring.
    healthchecks_verify_expected_db_vendor: >-
      {{
        {
          'sqlite': 'sqlite',
          'postgres': 'postgresql',
          'mysql': 'mysql',
        }[healthchecks_database_type]
      }}

    # The command prefix that runs a single SQL statement inside the database
    # container this scenario started, printing bare values with no headers.
    # Only referenced by the tasks guarded on a non-SQLite scenario, so the
    # variables it reads do not need to exist in the SQLite ones.
    #
    # The docker CLI is invoked directly here and below: the ansible-lint
    # environment used by pre-commit has no collections installed, so
    # community.docker.* would fail the playbook syntax check.
    healthchecks_verify_db_command: >-
      {{
        (
          'docker exec ' ~ (mariadb_identifier | default('mariadb')) ~
          ' mariadb --user=' ~ (healthchecks_database_mysql_username | quote) ~
          ' --password=' ~ (healthchecks_database_mysql_password | quote) ~
          ' --batch --skip-column-names ' ~ (healthchecks_database_name | quote) ~ ' -e '
        ) if healthchecks_database_type == 'mysql' else (
          'docker exec --env=PGPASSWORD=' ~ (healthchecks_database_postgres_password | quote) ~
          ' ' ~ (postgres_identifier | default('postgres')) ~
          ' psql -U ' ~ (healthchecks_database_postgres_username | quote) ~
          ' -d ' ~ (healthchecks_database_name | quote) ~ ' -tAc '
        )
      }}

    healthchecks_verify_tables_query: >-
      SELECT count(*) FROM information_schema.tables
      WHERE table_schema = {{ "DATABASE()" if healthchecks_database_type == 'mysql' else "'public'" }}

  tasks:
    - name: Run the shared Healthchecks verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
