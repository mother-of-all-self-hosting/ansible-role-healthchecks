---
# The role is not included in this playbook, so its defaults are not in
# scope. Reading defaults/main.yml directly ties the version assertion
# below.
- name: Load the role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: healthchecks_defaults

- name: Wait for Healthchecks service to become active (up to 180s)
  ansible.builtin.systemd:
    name: healthchecks.service
  register: healthchecks_service
  until: healthchecks_service.status.ActiveState == 'active'
  retries: 36
  delay: 5

- name: Assert Healthchecks service is active
  ansible.builtin.assert:
    that: healthchecks_service.status.ActiveState == 'active'
    fail_msg: "healthchecks.service not active ({{ healthchecks_service.status.ActiveState }})"
    success_msg: "healthchecks.service is active"

- name: Retrieve Healthchecks service log for debugging
  when: healthchecks_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: journalctl -xeu healthchecks.service
  changed_when: false

# An active unit says nothing about readiness here: uwsgi runs
# `manage.py migrate` from its `hook-pre-app` while the unit is already
# active, and it serves pages throughout. Worse, a Healthchecks that cannot
# reach its database at all still answers `/` and `/accounts/login/` with a
# fully rendered 200 - the login page needs no database until the form is
# submitted. `/api/v3/status/` is the one endpoint that opens a database
# connection on demand (it is what the image's own HEALTHCHECK probes), so
# it is the only honest readiness gate, and the only one that a scenario
# with broken database wiring cannot pass.
- name: Wait for the Healthchecks status endpoint to report a live database (up to 10m)
  ansible.builtin.uri:
    url: "{{ healthchecks_verify_base_url }}/api/v3/status/"
    method: GET
    status_code: [200]
    return_content: true
  register: healthchecks_status
  until: healthchecks_status.status == 200
  retries: 120
  delay: 5

- name: Assert Healthchecks reports a live database connection
  ansible.builtin.assert:
    that: healthchecks_status.content | trim == 'OK'
    fail_msg: "Unexpected /api/v3/status/ body: {{ healthchecks_status.content | default('no content') }}"
    success_msg: "Healthchecks reports a live database connection"

- name: Retrieve the Healthchecks login page
  ansible.builtin.uri:
    url: "{{ healthchecks_verify_base_url }}/accounts/login/"
    method: GET
    status_code: [200]
    return_content: true
  register: healthchecks_login_page

# The page title is where `SITE_NAME` from the role's environment file
# surfaces: an image started without one titles the same page
# "Log In - Mychecks", so this distinguishes a Healthchecks configured by
# this role from one running on upstream defaults.
- name: Assert the login page renders a sign-in form for this site
  ansible.builtin.assert:
    that:
      - "'<title>Log In - ' ~ healthchecks_defaults.healthchecks_environment_variable_site_name ~ '</title>' in healthchecks_login_page.content"
      - "'name=\"email\"' in healthchecks_login_page.content"
      - "'name=\"password\"' in healthchecks_login_page.content"
      - "'name=\"csrfmiddlewaretoken\"' in healthchecks_login_page.content"
    fail_msg: "The Healthchecks login page did not render a sign-in form for this site"
    success_msg: "The Healthchecks login page renders a sign-in form for '{{ healthchecks_defaults.healthchecks_environment_variable_site_name }}'"

# Tying the running Healthchecks to the version pinned in defaults/main.yml
# is what makes this scenario a real test of the version Renovate bumps: a
# bump to an image that cannot boot or migrate cannot pass here. The
# version is read out of the running application (which derives it from the
# CHANGELOG.md shipped inside the image) rather than from an image label,
# so it covers the self-build scenario too. Name and version are separated
# by a newline and indentation in the footer markup, hence the regex.
- name: Assert the running Healthchecks is the version this role installs
  ansible.builtin.assert:
    that: healthchecks_login_page.content is search('Healthchecks\s+' ~ (healthchecks_defaults.healthchecks_version | regex_escape) ~ '\s')
    fail_msg: >-
      The Healthchecks footer does not report {{ healthchecks_defaults.healthchecks_version }}:
      {{ healthchecks_login_page.content | regex_findall('Healthchecks\s+v[^\s<]*') | join(', ') | default('no version at all', true) }}
    success_msg: "The running Healthchecks reports {{ healthchecks_defaults.healthchecks_version }}"

# `createsuperuser` is the command this role documents for provisioning the
# first account, run here exactly as `tasks/createsuperuser.yml` runs it.
# It writes to the database through the same connection the application
# uses, so it fails outright on a scenario whose database wiring is broken.
- name: Create a Healthchecks superuser
  ansible.builtin.command:
    cmd: >-
      docker exec --user={{ healthchecks_uid }}:{{ healthchecks_gid }}
      {{ healthchecks_defaults.healthchecks_identifier }}
      /opt/healthchecks/manage.py createsuperuser
      --email {{ healthchecks_verify_superuser_email | quote }}
      --password {{ healthchecks_verify_superuser_password | quote }}
  register: healthchecks_createsuperuser
  changed_when: healthchecks_createsuperuser.rc == 0

# Healthchecks gives every new account a project, but its API key is only
# ever minted on request. `set_api_key()` returns the plaintext key (only a
# keyed digest of it is stored), which is what the management API below
# authenticates with.
- name: Mint an API key for the Healthchecks project of that superuser
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "--user={{ healthchecks_uid }}:{{ healthchecks_gid }}"
      - "{{ healthchecks_defaults.healthchecks_identifier }}"
      - /opt/healthchecks/manage.py
      - shell
      - -c
      - |
        from django.contrib.auth.models import User
        from hc.accounts.models import Project
        user = User.objects.get(email="{{ healthchecks_verify_superuser_email }}")
        project = Project.objects.filter(owner=user).first()
        if project is None:
            project = Project.objects.create(owner=user, name="Molecule")
        api_key = project.set_api_key()
        project.save()
        print("API_KEY=" + api_key)
  register: healthchecks_api_key_result
  changed_when: true

# Django's shell prefaces its output with a banner, so the key is picked
# out by its marker rather than taken as the whole of stdout.
- name: Remember the Healthchecks API key
  ansible.builtin.set_fact:
    healthchecks_verify_api_key: "{{ healthchecks_api_key_result.stdout_lines | select('match', '^API_KEY=') | first | regex_replace('^API_KEY=', '') }}"

# Everything from here on exercises what Healthchecks is for: a check is
# something that is expected to be pinged, and that goes down when it is
# not. Creating one writes a row through the management API.
- name: Create a check through the Healthchecks management API
  ansible.builtin.uri:
    url: "{{ healthchecks_verify_base_url }}/api/v3/checks/"
    method: POST
    headers:
      X-Api-Key: "{{ healthchecks_verify_api_key }}"
    body_format: json
    body:
      name: "{{ healthchecks_verify_check_name }}"
      timeout: 3600
      grace: 60
    status_code: [201]
    return_content: true
  register: healthchecks_check_created
  changed_when: true

- name: Assert the new check was created and is waiting for its first ping
  ansible.builtin.assert:
    that:
      - healthchecks_check_created.json.name == healthchecks_verify_check_name
      - healthchecks_check_created.json.status == 'new'
      - healthchecks_check_created.json.n_pings == 0
      - healthchecks_check_created.json.last_ping is none
    fail_msg: "Unexpected check payload: {{ healthchecks_check_created.json | default('no payload') }}"
    success_msg: "The check '{{ healthchecks_verify_check_name }}' was created and is waiting for its first ping"

# The ping URL the API hands out is built from `PING_ENDPOINT`, which this
# role derives from `healthchecks_scheme`, `healthchecks_hostname` and
# `healthchecks_path_prefix` - so its shape is proof that the role's
# environment file reached the running process. It carries no port (the
# hostname this scenario configures has none), which is why the ping below
# is sent to the published port instead of to this URL verbatim.
- name: Assert the ping URL is the one this role configured
  ansible.builtin.assert:
    that: healthchecks_check_created.json.ping_url.startswith(healthchecks_scheme ~ '://' ~ healthchecks_hostname ~ '/ping/')
    fail_msg: >-
      The check's ping URL is {{ healthchecks_check_created.json.ping_url }}, which is not under
      {{ healthchecks_scheme }}://{{ healthchecks_hostname }}/ping/ as this role configures
    success_msg: "The check's ping URL is {{ healthchecks_check_created.json.ping_url }}"

- name: Ping the check
  ansible.builtin.uri:
    url: "{{ healthchecks_verify_base_url }}/ping/{{ healthchecks_check_created.json.ping_url | regex_replace('^.*/ping/', '') }}"
    method: GET
    status_code: [200]
    return_content: true
  register: healthchecks_ping
  changed_when: true

- name: Assert the ping was accepted
  ansible.builtin.assert:
    that: healthchecks_ping.content | trim == 'OK'
    fail_msg: "The ping endpoint answered {{ healthchecks_ping.content | default('nothing') }}"
    success_msg: "The ping endpoint accepted the ping"

# The round trip closes here: a check that was 'new' a moment ago is
# reported 'up' because of a ping that arrived over HTTP and was recorded
# in the database. Nothing short of a working application on a working
# database produces that.
- name: Read the check back through the Healthchecks management API
  ansible.builtin.uri:
    url: "{{ healthchecks_verify_base_url }}/api/v3/checks/"
    method: GET
    headers:
      X-Api-Key: "{{ healthchecks_verify_api_key }}"
    status_code: [200]
    return_content: true
  register: healthchecks_checks_after_ping
  until: >-
    healthchecks_checks_after_ping.json.checks
    | selectattr('name', 'equalto', healthchecks_verify_check_name)
    | map(attribute='status') | first | default('') == 'up'
  retries: 6
  delay: 5

- name: Assert the ping flipped the check to 'up'
  vars:
    healthchecks_verify_check: >-
      {{
        healthchecks_checks_after_ping.json.checks
        | selectattr('name', 'equalto', healthchecks_verify_check_name) | first
      }}
  ansible.builtin.assert:
    that:
      - healthchecks_verify_check.status == 'up'
      - healthchecks_verify_check.n_pings == 1
      - healthchecks_verify_check.last_ping is not none
    fail_msg: "The check did not go up after being pinged: {{ healthchecks_verify_check }}"
    success_msg: >-
      The check went up after being pinged, last seen at
      {{ healthchecks_verify_check.last_ping }}

# Everything above would read the same if Healthchecks had quietly fallen
# back to some other database, so the connection it actually opened is read
# out of the running application.
- name: Read the database connection the running Healthchecks opened
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "--user={{ healthchecks_uid }}:{{ healthchecks_gid }}"
      - "{{ healthchecks_defaults.healthchecks_identifier }}"
      - /opt/healthchecks/manage.py
      - shell
      - -c
      - |
        from django.db import connection
        print("DB_VENDOR=" + connection.vendor)
        print("DB_NAME=" + str(connection.settings_dict["NAME"]))
        print("DB_TABLES=" + str(len(connection.introspection.table_names())))
  register: healthchecks_db_connection
  changed_when: false

- name: Assert Healthchecks runs on the database this scenario wired up
  ansible.builtin.assert:
    that:
      - "'DB_VENDOR=' ~ (healthchecks_verify_expected_db_vendor | trim) in healthchecks_db_connection.stdout_lines"
      - "healthchecks_database_type == 'sqlite' or 'DB_NAME=' ~ healthchecks_database_name in healthchecks_db_connection.stdout_lines"
    fail_msg: >-
      Healthchecks did not connect to the {{ healthchecks_database_type }} database this scenario
      wired up: {{ healthchecks_db_connection.stdout_lines | select('match', '^DB_') | join(', ') }}
    success_msg: "Healthchecks runs on {{ healthchecks_database_type }}, as this scenario asks for"

# And for the scenarios that started a database container, the same thing
# is confirmed from the other end - the schema, and the row this ping just
# wrote, are looked up in that container rather than taken on the
# application's word.
- name: Count the Healthchecks tables in the database container
  when: healthchecks_database_type != 'sqlite'
  ansible.builtin.command:
    cmd: "{{ healthchecks_verify_db_command }} {{ healthchecks_verify_tables_query | quote }}"
  register: healthchecks_db_tables
  changed_when: false

- name: Assert Healthchecks migrated its schema into that database
  when: healthchecks_database_type != 'sqlite'
  ansible.builtin.assert:
    that: healthchecks_db_tables.stdout | trim | int > 0
    fail_msg: >-
      The {{ healthchecks_database_type }} database '{{ healthchecks_database_name }}' holds no
      tables - Healthchecks is not using it
    success_msg: >-
      The {{ healthchecks_database_type }} database '{{ healthchecks_database_name }}' holds
      {{ healthchecks_db_tables.stdout | trim }} tables

- name: Read the pinged check out of the database container
  when: healthchecks_database_type != 'sqlite'
  ansible.builtin.command:
    cmd: >-
      {{ healthchecks_verify_db_command }}
      {{ ("SELECT status, n_pings FROM api_check WHERE name = '" ~ healthchecks_verify_check_name ~ "'") | quote }}
  register: healthchecks_db_check_row
  changed_when: false

- name: Assert the ping was recorded in that database
  when: healthchecks_database_type != 'sqlite'
  ansible.builtin.assert:
    that: healthchecks_db_check_row.stdout | trim | regex_replace('[|\s]+', ' ') == 'up 1'
    fail_msg: >-
      The api_check row for '{{ healthchecks_verify_check_name }}' reads
      '{{ healthchecks_db_check_row.stdout | trim | default('nothing at all', true) }}',
      expected an up check with one ping
    success_msg: "The api_check row for '{{ healthchecks_verify_check_name }}' records one ping and an up status"

- name: Show Healthchecks verification summary
  vars:
    healthchecks_verify_check: >-
      {{
        healthchecks_checks_after_ping.json.checks
        | selectattr('name', 'equalto', healthchecks_verify_check_name) | first
      }}
  ansible.builtin.debug:
    msg:
      - "Healthchecks systemd: {{ healthchecks_service.status.ActiveState }}"
      - "Healthchecks status endpoint: {{ healthchecks_status.status }} {{ healthchecks_status.content | trim }}"
      - "Healthchecks version: {{ healthchecks_defaults.healthchecks_version }}"
      - "Healthchecks login page: {{ healthchecks_login_page.status }}"
      - "Healthchecks check after ping: {{ healthchecks_verify_check.status }} ({{ healthchecks_verify_check.n_pings }} ping)"
      - "Healthchecks database connection: {{ healthchecks_db_connection.stdout_lines | select('match', '^DB_') | join(', ') }}"
      - "Healthchecks database container: {{ healthchecks_db_check_row.stdout | default('(not applicable to sqlite)', true) | trim }}"
